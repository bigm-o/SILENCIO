<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SILÊNCIO · 4 · Halo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hero.css">
<style>
/* 4 · Halo: a single beam of light, dust drifting through it, and the chrome head floating beneath a ring of gold:
   the membership ring as a crown. The head hovers and turns slightly towards the cursor. */
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(8,8,10,.7),transparent 45%)}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.fg .frame{transform-origin:69% 45%}
.copy{position:absolute;z-index:10;left:calc(var(--pad) + 2vw);top:50%;transform:translateY(-44%);max-width:600px}
.copy h1{margin-top:28px;font:400 clamp(58px,5.4vw,96px)/1.04 'Libre Caslon Display',serif;letter-spacing:-.01em}
.copy p:not(.label){margin-top:26px;color:var(--muted);font-size:16px;max-width:44ch}
.copy .label{color:var(--gold)}
.ctas{margin-top:44px}
.btn.white{background:#F1F0F3;box-shadow:none;border-radius:0}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<section class="hero" aria-label="SILÊNCIO">
  <div class="layer bg" data-depth="6"><div class="frame"><img src="assets/o4/bg.webp" alt=""></div></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="layer fg" data-depth="-14"><div class="frame"><img src="assets/o4/fg.webp" alt="A floating chrome head, blindfolded in obsidian engraved with the emblem, beneath a ring of gold light"></div></div>
  <div class="shade" aria-hidden="true"></div>

  <nav class="nav" aria-label="Main" data-reveal="1.4">
    <a class="logo" href="#" aria-label="SILÊNCIO home"><img src="assets/emblem.webp" alt="" data-intro-logo-slot></a>
    <div class="links"><a href="#">The Club</a><a href="#">Dining</a><a href="#">Lounge</a><a href="#">Gatherings</a></div>
    <a class="btn outline pill cta" href="#">Request an introduction</a>
  </nav>

  <div class="copy">
    <p class="label" data-reveal>The daring 1%</p>
    <h1 data-reveal>Belonging,<br>not being seen.</h1>
    <p data-reveal>Membership is never bought. It is earned, and then offered.</p>
    <div class="ctas" data-reveal><a class="btn white" href="#">Request an introduction</a></div>
  </div>
</section>
<script src="assets/gsap.min.js"></script>
<script src="assets/hero.js"></script>
<script>
(() => {
  if (SilencioHero.reduce || !window.gsap) return;
  // the head hovers: a slow float, and a slight turn towards the cursor
  gsap.to('.fg .frame', { y: -10, duration: 5.5, ease: 'sine.inOut', yoyo: true, repeat: -1 });
  const rot = gsap.quickTo('.fg .frame', 'rotation', { duration: 2.4, ease: 'power3' });
  SilencioHero.onMove.push((e, nx) => rot(nx * 2.2));
  // dust in the beam: driven by gsap.ticker, no second animation loop
  const c = document.getElementById('dust'), x = c.getContext('2d');
  let W, H, P = [];
  const size = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 90; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, v: Math.random() * .00018 + .00005, a: Math.random() * .5 + .15, s: Math.random() * 6.28 });
  gsap.ticker.add(t => {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y -= p.v; if (p.y < -.02) p.y = 1.02;
      const px = (0.69 + (p.x - .5) * 0.26 + Math.sin(t * .3 + p.s) * .006) * W, py = p.y * H;
      const beam = Math.max(0, 1 - Math.abs(px / W - .69) / .14);         // brighter inside the beam
      x.globalAlpha = p.a * beam * (0.6 + 0.4 * Math.sin(t + p.s)); x.fillStyle = '#F3E6C8';
      x.beginPath(); x.arc(px, py, p.r * devicePixelRatio, 0, 6.283); x.fill();
    }
  });
})();
</script>
</body>
</html>
