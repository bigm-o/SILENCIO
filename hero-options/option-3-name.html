<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SILÊNCIO · 3 · The Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hero.css">
<style>
/* 3 · The Name: the blindfolded figure stands in front of SILÊNCIO in chrome. The two planes separate strongly with the cursor,
   so the name reads as a real object in a real room. The glass bar names what membership opens, quietly. */
.bg img{filter:brightness(.9)}
.nav{grid-template-columns:1fr auto 1fr}
.nav .links.left{justify-self:start}
.nav .logo{grid-column:2;width:46px;height:46px;justify-self:center}
.nav .links.left{grid-column:1;grid-row:1}
.nav .cta{grid-column:3;grid-row:1}
.motto{position:absolute;z-index:10;left:50%;top:15.5%;translate:-50% 0;font:italic 400 clamp(20px,1.7vw,28px)/1 'Bodoni Moda',serif;color:#CFCFD6;letter-spacing:.02em;white-space:nowrap}
.bar{position:absolute;z-index:10;left:var(--pad);right:var(--pad);bottom:28px;display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;border-radius:2px;overflow:hidden}
.cell{position:relative;padding:26px 30px 28px;display:flex;flex-direction:column;gap:10px;transition:background .8s var(--ease)}
.cell+.cell{box-shadow:inset 1px 0 0 rgba(255,255,255,.07)}
.cell::before{content:"";position:absolute;left:30px;right:30px;top:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
.cell:hover{background:rgba(255,255,255,.03)}
.cell:hover::before{transform:scaleX(1)}
.cell .label{color:var(--ink)}
.cell em{font:italic 400 17px/1.3 'Bodoni Moda',serif;color:var(--muted)}
.cell.ask{flex-direction:row;align-items:center;justify-content:space-between;font:600 11px/1 Manrope,sans-serif;letter-spacing:.26em;text-transform:uppercase}
.cell.ask .arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);transition:transform .8s var(--ease),box-shadow .8s}
.cell.ask:hover .arrow{transform:translateX(6px);box-shadow:inset 0 0 0 1px var(--gold)}
.cell.ask .arrow::after{content:"";width:12px;height:12px;border-top:1px solid currentColor;border-right:1px solid currentColor;rotate:45deg;translate:-2px 0}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<section class="hero" aria-label="SILÊNCIO">
  <div class="layer bg" data-depth="8"><div class="frame"><img src="assets/o3/bg.webp" alt="The name SILÊNCIO in tall polished chrome letters on a black reflective floor"></div></div>
  <div class="layer fg" data-depth="-26"><div class="frame"><img src="assets/o3/fg.webp" alt="A white marble bust with gold-leaf hair, blindfolded in navy silk inlaid with the emblem in gold"></div></div>

  <nav class="nav" aria-label="Main" data-reveal="1.2">
    <div class="links left"><a href="#">The Club</a><a href="#">Dining</a><a href="#">Lounge</a><a href="#">Gatherings</a></div>
    <a class="logo" href="#" aria-label="SILÊNCIO home"><img src="assets/emblem.webp" alt="" data-intro-logo-slot></a>
    <a class="btn outline cta" href="#">Request an introduction</a>
  </nav>

  <p class="motto" data-reveal="1.6" lang="la">Prîmus intêr pâres</p>

  <div class="bar glass" data-reveal="1.9">
    <a class="cell" href="#"><span class="label">Dining</span><em>Japanese and Italian, for members</em></a>
    <a class="cell" href="#"><span class="label">Lounge</span><em>After hours, in confidence</em></a>
    <a class="cell" href="#"><span class="label">Gatherings</span><em>By invitation only</em></a>
    <a class="cell ask" href="#">Request an introduction<span class="arrow" aria-hidden="true"></span></a>
  </div>
</section>
<script src="assets/gsap.min.js"></script>
<script src="assets/hero.js"></script>
<script>
if (!SilencioHero.reduce && window.gsap) {
  gsap.from('.fg .frame', { y: 40, opacity: 0, duration: 2.4, ease: 'expo.out', delay: 0.2 });
  gsap.from('.bg .frame', { scale: 1.06, duration: 3.6, ease: 'expo.out' });
}
</script>
</body>
</html>
